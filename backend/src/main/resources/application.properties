spring.application.name=devarena-backend

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=${PORT:8080}

app.jwt.secret=${APP_JWT_SECRET:gEvp48sHZn2vXoXJWvLQ2GbQnL36/wq6Qb8YyG3AHqjU/lIDdvqgwawQhGuxLrs8xxMGMfluqYBBL6IL750P7g==}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dumrptvxe}
cloudinary.api-key=${CLOUDINARY_API_KEY:149346921314448}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Frontend base URL used to redirect after a successful OAuth login
app.frontend.base-url=${APP_FRONTEND_BASE_URL:https://codementor.urbancode.in}

# OAuth provider credentials (registrations are built programmatically in OAuth2ClientConfig)
app.oauth2.google.client-id=${GOOGLE_CLIENT_ID:}
app.oauth2.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.oauth2.github.client-id=${GITHUB_CLIENT_ID:}
app.oauth2.github.client-secret=${GITHUB_CLIENT_SECRET:}

# Gmail SMTP for password reset emails
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:no-reply@devarena.local}}
app.password-reset.token-ttl-minutes=${PASSWORD_RESET_TTL_MINUTES:30}
