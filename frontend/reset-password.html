<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - DevArena</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <script>if(localStorage.getItem('theme')==='light')document.documentElement.setAttribute('data-theme','light');</script>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="navbar-brand">Dev<span>Arena</span></a>
        <div class="navbar-links" id="nav-links"></div>
    </nav>

    <div class="auth-page">
        <div class="auth-card">
            <h2>Set a new password</h2>
            <p class="subtitle">Choose a strong password for your account.</p>
            <form id="reset-form">
                <div class="form-group">
                    <label for="password">New password</label>
                    <input type="password" class="form-control" id="password" required placeholder="At least 8 characters">
                    <div id="password-error" class="password-error"></div>
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirm new password</label>
                    <input type="password" class="form-control" id="confirm-password" required placeholder="Re-enter password">
                </div>
                <button type="submit" class="btn btn-primary btn-lg">Reset password</button>
            </form>
            <div class="auth-footer">
                <a href="login.html">Back to login</a>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/mascot.js"></script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
